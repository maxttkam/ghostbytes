name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --dev
      - name: Analysing the code with pylint
        run: |
          uv run pylint $(git ls-files '*.py')
